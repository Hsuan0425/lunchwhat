<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="午餐">
<meta name="theme-color" content="#f5efe6">
<title>午餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Serif+TC:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f5efe6;
    --bg-card: #fbf6ec;
    --ink: #2a2520;
    --ink-soft: #6b5d4f;
    --ink-faint: #b0a28e;
    --accent: #b8542e;
    --line: #d9ccb0;
    --green: #5e7a4a;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Serif TC', 'Fraunces', Georgia, serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background-image:
      radial-gradient(circle at 15% 5%, rgba(184, 84, 46, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(107, 93, 79, 0.04) 0%, transparent 50%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3CfeColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.14 0 0 0 0 0.12 0 0 0 0.03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  .app {
    position: relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 24px 100px;
  }

  /* Today card */
  .today-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 26px 22px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 0 1px 0 rgba(42, 37, 32, 0.04);
  }

  .today-card::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 20px;
    right: 20px;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 12px);
    opacity: 0.3;
  }

  .date-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .date-main {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 6px;
  }

  .date-sub {
    font-size: 14px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  .today-status {
    margin-top: 0;
    padding-top: 0;
  }

  .today-panel {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 18px 18px 16px;
    margin-bottom: 26px;
  }

  .today-status-empty {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
  }

  .today-status-filled {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .today-shop {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--accent);
    line-height: 1.2;
    flex: 1;
    min-width: 0;
    word-break: break-word;
  }

  .today-change {
    background: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px 8px;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .today-change:active {
    background: var(--ink);
    color: var(--bg-card);
  }

  /* Nearby hero button */
  .nearby-hero {
    width: 100%;
    padding: 18px;
    margin-top: 4px;
    margin-bottom: 24px;
    background: var(--ink);
    color: var(--bg-card);
    border: none;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s;
  }

  .nearby-hero:active { transform: scale(0.98); }

  .nearby-hero::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(251, 246, 236, 0.2);
    pointer-events: none;
  }

  .nearby-hero .pin {
    display: inline-block;
    margin-right: 8px;
    font-size: 16px;
  }

  .nearby-hero.loading {
    opacity: 0.7;
    cursor: wait;
  }

  .nearby-hero.loading .pin {
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Section label */
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-label .zh {
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    text-transform: none;
  }

  /* Nearby results */
  .nearby-results {
    margin-bottom: 24px;
  }

  .nearby-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-bottom: 12px;
    padding: 8px 10px;
    background: var(--bg-card);
    border-left: 2px solid var(--green);
  }

  .nearby-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .nearby-btn {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 12px 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .nearby-btn:active {
    background: var(--ink);
    color: var(--bg-card);
    border-color: var(--ink);
  }

  .nearby-btn .distance {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }

  .nearby-btn:active .distance {
    color: var(--bg-card);
    opacity: 0.7;
  }

  .nearby-empty {
    padding: 14px;
    background: var(--bg-card);
    border: 1px dashed var(--line);
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    text-align: center;
  }

  .nearby-error {
    padding: 14px;
    background: #fef0eb;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
  }

  /* Shop grid */
  .shop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .shop-btn {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 16px 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: transform 0.1s;
    position: relative;
    min-height: 56px;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .shop-btn:active {
    transform: scale(0.97);
    background: var(--ink);
    color: var(--bg-card);
    border-color: var(--ink);
  }

  .shop-btn .count {
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
  }

  /* Custom input */
  .custom-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .custom-input-wrap input {
    width: 100%;
    padding: 16px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
  }

  .custom-input-wrap input:focus { border-color: var(--accent); }
  .custom-input-wrap input::placeholder { color: var(--ink-faint); font-style: italic; }

  .btn-record-full {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: var(--bg-card);
    border: none;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    letter-spacing: 0.25em;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
  }

  .btn-record-full:active {
    transform: scale(0.98);
  }

  .btn-record-full::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(251, 246, 236, 0.2);
    pointer-events: none;
  }

  .btn-record-full:disabled {
    background: var(--line);
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  .btn-record-full:disabled::before {
    border-color: transparent;
  }

  /* History */
  .history-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px dashed var(--line);
  }

  .history-item:last-child { border-bottom: none; }

  .history-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    min-width: 72px;
    flex-shrink: 0;
  }

  .history-date .day {
    display: block;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 10px;
    margin-top: 2px;
  }

  .history-shop {
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    flex: 1;
    word-break: break-word;
    line-height: 1.4;
  }

  .history-shop.today-mark { color: var(--accent); font-weight: 500; }

  .history-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .history-delete,
  .history-edit {
    background: none;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  .history-delete { color: var(--ink-faint); }
  .history-edit   { color: var(--ink-faint); }

  .history-delete:active { color: var(--accent); opacity: 1; }
  .history-edit:active   { color: var(--green);  opacity: 1; }

  .modal-input {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    font-family: 'Noto Serif TC', serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
    margin-bottom: 4px;
  }
  .modal-input:focus { border-color: var(--accent); }

  .btn-confirm {
    background: var(--green);
    color: var(--bg-card);
  }

  /* Today multi-entry */
  .today-multi { display: flex; flex-direction: column; gap: 8px; }

  .today-multi-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .today-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    flex-shrink: 0;
    min-width: 38px;
  }

  .today-multi-item .today-shop {
    font-size: 18px;
    flex: 1;
  }

  .today-del-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 3px 7px;
    flex-shrink: 0;
    line-height: 1;
  }
  .today-del-btn:active { background: var(--accent); color: var(--bg-card); border-color: var(--accent); }

  .today-limit-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }

  .today-limit-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
  }

  .today-limit-text.full { color: var(--accent); }

  /* History time badge */
  .history-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin-right: 6px;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 30px 20px;
    color: var(--ink-faint);
  }

  .empty-mark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 48px;
    color: var(--line);
    line-height: 1;
    margin-bottom: 10px;
  }

  .empty-text { font-size: 13px; letter-spacing: 0.1em; }

  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--bg-card);
    padding: 12px 22px;
    font-size: 14px;
    letter-spacing: 0.1em;
    z-index: 200;
    transition: transform 0.3s ease;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .footer-link {
    text-align: center;
    padding: 20px 0 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .footer-link button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    text-transform: inherit;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(42, 37, 32, 0.5);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    border-radius: 16px 16px 0 0;
    animation: slideUp 0.25s ease;
    max-height: 80vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    cursor: pointer;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--line) !important;
    color: var(--ink-soft);
  }

  .btn-danger {
    background: var(--accent);
    color: var(--bg-card);
  }

  /* ===== 付款人 Payers ===== */
  .payer-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 2px 0 4px 48px;
  }

  /* 按鈕固定尺寸,選取時不會撐開造成版面跳動 */
  .payer-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    line-height: 1;
    height: 38px;
    min-width: 72px;
    padding: 0 14px;
    cursor: pointer;
  }

  .payer-chip.on {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg-card);
  }

  .payer-chip.each {
    min-width: 96px;
    font-size: 13px;
  }

  .payer-more {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 6px 0;
    margin: 0 0 4px 48px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    display: block;
  }

  /* 分開付明細 */
  .split-box {
    margin: 4px 0 6px 48px;
    border: 1px dashed var(--line);
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.35);
  }

  .split-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }

  .split-tick {
    width: 20px;
    height: 20px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: transparent;
    cursor: pointer;
  }

  .split-line.on .split-tick {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg-card);
  }

  .split-name {
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    color: var(--ink-soft);
    flex: 1;
    cursor: pointer;
  }

  .split-line.on .split-name { color: var(--ink); }

  .split-line .amt {
    width: 82px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    text-align: right;
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
    flex-shrink: 0;
  }

  .split-line .amt:focus { border-color: var(--green); }
  .split-line:not(.on) .amt { opacity: 0.35; }

  .split-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }

  .split-total {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }

  .split-total b { color: var(--green); }

  .split-close {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: 'Noto Serif TC', serif;
    font-size: 12px;
    padding: 5px 12px;
    cursor: pointer;
  }

  .payer-sum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
    margin: 0 0 6px 48px;
  }

  .payer-sum b { color: var(--green); font-weight: 600; }

  .payer-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--ink-faint);
    margin: 0 0 4px 48px;
    text-transform: uppercase;
  }

  .history-payer {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--green);
    margin-top: 3px;
  }

  /* 付款人設定 */
  .payer-setup {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }

  .payer-add {
    border: 1px dashed var(--line) !important;
    background: none;
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    cursor: pointer;
    padding: 11px 12px;
  }

  .payer-add:active { border-color: var(--green) !important; color: var(--green); }

  .payer-setup input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    font-family: 'Noto Serif TC', serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    -webkit-appearance: none;
    border-radius: 0;
  }

  .payer-setup input:focus { border-color: var(--green); }
  .payer-setup input::placeholder { color: var(--ink-faint); font-style: italic; }

  .collapse-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 4px 9px;
    cursor: pointer;

  /* 附近搜尋:診斷用 */
  .nearby-error .retry {
    display: block;
    margin-top: 10px;
    background: var(--accent);
    color: var(--bg-card);

    padding: 9px 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    letter-spacing: 0.1em;

  .nearby-error .why {

    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;

</style>
</head>
<body>
<div class="app">

  <!-- TODAY (只放日期) -->
  <div class="today-card">
    <div class="date-label" id="date-label">TODAY</div>
    <div class="date-main" id="date-main">—</div>
    <div class="date-sub" id="date-sub">—</div>
  </div>

  <!-- 1. 先輸入店名 -->
  <div class="section-label">
    <span>Write In <span class="zh">· 1. 輸入店名</span></span>
  </div>
  <div class="custom-input-wrap">
    <input type="text" id="custom-input" placeholder="輸入店名..." autocomplete="off">
    <button id="btn-custom" class="btn-record-full">記 錄 今 日 午 餐</button>
  </div>

  <!-- 2. 今日已記錄 + 誰付的錢 -->
  <div class="section-label">
    <span>Today <span class="zh">· 2. 今天吃了 &amp; 誰付的</span></span>
  </div>
  <div class="today-panel">
    <div class="today-status" id="today-status"></div>
  </div>

  <!-- PAYER SETUP -->
  <div class="section-label">
    <span>Payers <span class="zh">· 付錢的人(最多 4 位)</span></span>
    <button class="collapse-toggle" id="payer-setup-toggle">設定</button>
  </div>
  <div id="payer-setup-wrap" style="display:none;">
    <div class="payer-setup" id="payer-setup"></div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--ink-faint);margin-bottom:22px;">
      留空即不顯示該按鈕 · 名字改了不影響已存的紀錄
    </div>
  </div>

  <!-- QUICK SHOPS -->
  <div id="quick-section">
    <div class="section-label">
      <span>Recent Spots <span class="zh">· 常去</span></span>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </div>

  <!-- NEARBY (hero) -->
  <button class="nearby-hero" id="btn-nearby">
    <span class="pin">◉</span>搜尋我附近的餐廳
  </button>

  <!-- NEARBY RESULTS -->
  <div class="nearby-results" id="nearby-results"></div>

  <!-- HISTORY -->
  <div class="section-label">
    <span>Log <span class="zh">· 最近紀錄</span></span>
    <span class="zh" style="font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;" id="history-count"></span>
  </div>
  <div id="history-list"></div>
  <div class="footer-link" id="footer-link"></div>
  <div style="text-align:center; padding: 0 0 20px;">
    <button onclick="syncFromSheets(true)" style="background:none; border:1px solid var(--line); color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.15em; padding:6px 14px; cursor:pointer;">☁ 從雲端同步</button>
  </div>

</div>

<div class="modal-backdrop" id="modal-confirm">
  <div class="modal">
    <h3 class="modal-title" id="modal-confirm-title">確認?</h3>
    <p id="modal-confirm-text" style="color:var(--ink-soft); margin:0;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-confirm')">取消</button>
      <button class="btn-danger" id="modal-confirm-yes">確定</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-edit">
  <div class="modal">
    <h3 class="modal-title">修改店名</h3>
    <p id="modal-edit-date" style="color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; margin:0 0 14px;"></p>
    <input type="text" class="modal-input" id="modal-edit-input" placeholder="輸入新的店名...">
    <div class="payer-hint" style="margin:14px 0 6px 0;">付款方式</div>
    <div id="modal-edit-payers" style="margin-left:0;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-edit')">取消</button>
      <button class="btn-confirm" id="modal-edit-yes">確定修改</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-all">
  <div class="modal">
    <h3 class="modal-title">全部紀錄</h3>
    <div id="modal-all-list"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-all')" style="flex:1;">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Google Sheets 同步設定 ──────────────────────────
  // 完成 Apps Script 部署後，把網址貼在這裡（引號內）
  const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyio5nC5AmshSYi-lgeqzH_FmkZacwukS6SJP7qtjH9eLuh3Dfsw5-vAAqLMsfKI98r/exec';
  // ────────────────────────────────────────────────────

  const EACH_TAG = '各付各';

  // 付款人序列化:各付各 -> "各付各";其他 -> "小明:120|阿華:80"(沒填金額就是「小明:」)
  function payersToStr(record) {
    if (record && record.each) return EACH_TAG;
    const payers = record && record.payers;
    if (!Array.isArray(payers) || payers.length === 0) return '';
    return payers.map(p => String(p.name).replace(/[:|]/g, ' ') + ':' + (p.amount === '' || p.amount == null ? '' : p.amount)).join('|');
  }

  function payersFromStr(str) {
    if (!str) return { each: false, payers: [] };
    if (String(str).trim() === EACH_TAG) return { each: true, payers: [] };
    const payers = String(str).split('|').filter(Boolean).map(seg => {
      const i = seg.lastIndexOf(':');
      if (i < 0) return { name: seg.trim(), amount: '' };
      const amt = seg.slice(i + 1).trim();
      return { name: seg.slice(0, i).trim(), amount: amt === '' ? '' : Number(amt) };
    }).filter(p => p.name);
    return { each: false, payers: payers };
  }

  function syncToSheets(action, record) {
    if (!SHEETS_URL) return;
    try {
      const params = new URLSearchParams({
        action: action,
        id:     record.id   || '',
        date:   record.date || '',
        time:   record.time || '',
        shop:   record.shop || '',
        payers: payersToStr(record),
      });
      // 用 GET + no-cors，避免 POST redirect 問題
      fetch(SHEETS_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' })
        .catch(() => { /* 離線時靜默失敗,本地資料優先 */ });
    } catch (e) { /* 本地資料優先，同步失敗靜默處理 */ }
  }

  const STORAGE_KEY = 'lunch_simple_v2';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { records: [] };
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ── 從 Google Sheets 讀取資料（JSONP 繞過 CORS）──
  function syncFromSheets(manual) {
    if (!SHEETS_URL) return;
    if (manual) showToast('☁ 同步中...');

    const cbName = '_sc_' + Date.now();
    const script = document.createElement('script');

    window[cbName] = function(data) {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (!data || !data.ok || !Array.isArray(data.records) || data.records.length === 0) {
        if (manual) showToast('☁ 雲端無資料');
        return;
      }
      const localIds = new Set(state.records.map(r => r.id));
      let added = 0;
      data.records.forEach(r => {
        if (!localIds.has(r.id) && r.shop) {
          const pay = payersFromStr(r.payers);
          state.records.push({ id: r.id, date: r.date, time: r.time || '', shop: r.shop, payers: pay.payers, each: pay.each, createdAt: Date.now() });
          added++;
        }
      });
      if (added > 0) {
        state.records.sort((a, b) => {
          const dc = a.date.localeCompare(b.date);
          return dc !== 0 ? dc : (a.time || '').localeCompare(b.time || '');
        });
        saveData();
        renderAll();
        showToast('☁ 已還原 ' + added + ' 筆紀錄');
      } else if (manual) {
        showToast('☁ 已是最新，無需更新');
      }
    };

    script.onerror = function() {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (manual) showToast('☁ 同步失敗，請檢查網路');
    };

    script.src = SHEETS_URL + '?action=getAll&callback=' + cbName;
    document.head.appendChild(script);
  }

  const MAX_PAYERS = 4;

  let state = loadData();
  if (!Array.isArray(state.payerNames)) state.payerNames = ['我'];
  // 「各付各」現在是獨立的付款方式,不再佔用人名格
  state.payerNames = state.payerNames
    .map(n => String(n || '').trim())
    .filter(n => n && n !== EACH_TAG && n !== '各付各的')
    .slice(0, MAX_PAYERS);
  if (state.payerNames.length === 0) state.payerNames = ['我'];

  state.records.forEach(r => {
    if (!Array.isArray(r.payers)) r.payers = [];
    // 舊資料若把「各付各」存成人名,轉成 each 旗標
    if (r.payers.some(p => p.name === EACH_TAG || p.name === '各付各的')) {
      r.each = true;
      r.payers = [];
    }
    if (typeof r.each !== 'boolean') r.each = false;
  });
  saveData();   // 立刻把遷移後的資料寫回,避免下次載入又跑一次

  function activePayerNames() {
    return state.payerNames.map(n => String(n || '').trim()).filter(Boolean);
  }

  // 哪些紀錄目前展開了「分開付」明細
  const splitOpen = new Set();

  // ========== Utils ==========
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDateMono(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function formatDateShort(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }

  function formatDateFull(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }

  function dayShort(dateStr) {
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    return days[new Date(dateStr + 'T00:00:00').getDay()];
  }

  function dayZh(dateStr) {
    const days = ['日', '一', '二', '三', '四', '五', '六'];
    return '星期' + days[new Date(dateStr + 'T00:00:00').getDay()];
  }

  function daysAgo(dateStr) {
    const today = new Date(todayISO() + 'T00:00:00');
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((today - target) / (1000 * 60 * 60 * 24));
  }

  function relativeDay(dateStr) {
    const n = daysAgo(dateStr);
    if (n === 0) return '今天';
    if (n === 1) return '昨天';
    if (n === 2) return '前天';
    if (n < 7) return n + ' 天前';
    return formatDateShort(dateStr);
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }
  window.closeModal = closeModal;

  // ========== Record ==========
  function getTodayRecord() {
    return state.records.find(r => r.date === todayISO());
  }

  function nowTimeStr() {
    const n = new Date();
    return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }

  function recordLunch(shop) {
    const today = todayISO();
    shop = shop.trim();
    if (!shop) return;

    const todayCount = state.records.filter(r => r.date === today).length;
    if (todayCount >= 3) {
      showToast('今日已達上限（3 家）');
      return;
    }

    const t = nowTimeStr();
    const newRecord = { id: uid(), date: today, shop: shop, time: t, payers: [], each: false, createdAt: Date.now() };
    state.records.push(newRecord);
    showToast('✓ 已記下 · ' + t);
    saveData();
    syncToSheets('add', newRecord);
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  window.recordLunch = recordLunch;

  // ========== 付款人 UI ==========
  // 兩層式:第一層單選(誰付 / 各付各),要拆帳才展開第二層填金額
  function findRecord(id) { return state.records.find(r => r.id === id); }

  function hasAmount(p) {
    const n = Number(p.amount);
    return p.amount !== '' && p.amount != null && !isNaN(n);
  }

  function payerText(r) {
    if (r.each) return '各付各';
    const ps = r.payers || [];
    if (ps.length === 0) return '';
    if (ps.length === 1 && !hasAmount(ps[0])) return ps[0].name + ' 付';
    let total = 0;
    const parts = ps.map(p => {
      if (hasAmount(p)) { total += Number(p.amount); return p.name + ' $' + Number(p.amount); }
      return p.name;
    });
    return parts.join(' · ') + (ps.length > 1 && total > 0 ? ' — 合計 $' + total : '');
  }

  function buildPayerBlock(r, ctx) {
    const names = activePayerNames();
    const ml = ctx === 'modal' ? '0' : '48px';
    if (names.length === 0) {
      return '<div class="payer-block" data-rid="' + r.id + '" data-ctx="' + ctx + '">' +
             '<div class="payer-hint" style="margin-left:' + ml + ';">尚未設定付款人 · 點「設定」新增</div></div>';
    }

    let html = '<div class="payer-block" data-rid="' + r.id + '" data-ctx="' + ctx + '">';

    if (splitOpen.has(r.id)) {
      // 第二層:分開付明細
      let total = 0;
      html += '<div class="payer-hint" style="margin-left:' + ml + ';">分開付 · 勾選並填金額</div>';
      html += '<div class="split-box" style="margin-left:' + ml + ';">';
      names.forEach(n => {
        const p = (r.payers || []).find(x => x.name === n);
        const on = !!p;
        if (on && hasAmount(p)) total += Number(p.amount);
        const val = (!p || !hasAmount(p)) ? '' : String(Number(p.amount));
        html += '<div class="split-line' + (on ? ' on' : '') + '" data-rid="' + r.id + '" data-name="' + escapeHtml(n) + '">' +
                '<span class="split-tick">✓</span>' +
                '<span class="split-name">' + escapeHtml(n) + '</span>' +
                '<input class="amt" type="text" inputmode="numeric" placeholder="$" value="' + escapeHtml(val) + '">' +
                '</div>';
      });
      html += '<div class="split-foot">' +
              '<span class="split-total">合計 <b>$' + total + '</b></span>' +
              '<button class="split-close" data-rid="' + r.id + '">收起</button>' +
              '</div></div>';
    } else {
      // 第一層:單選
      html += '<div class="payer-hint" style="margin-left:' + ml + ';">誰付的錢?</div>';
      html += '<div class="payer-row" style="margin-left:' + ml + ';">';
      names.forEach(n => {
        const on = !r.each && (r.payers || []).length === 1 && r.payers[0].name === n;
        html += '<span class="payer-chip' + (on ? ' on' : '') + '" data-rid="' + r.id + '" data-name="' + escapeHtml(n) + '">' + escapeHtml(n) + '</span>';
      });
      html += '</div>';
      html += '<div class="payer-row" style="margin-left:' + ml + ';">' +
              '<span class="payer-chip each' + (r.each ? ' on' : '') + '" data-rid="' + r.id + '" data-each="1">各付各的</span>' +
              '</div>';
      html += '<button class="payer-more" data-rid="' + r.id + '" style="margin-left:' + ml + ';">分開付 · 填金額 ›</button>';
    }

    const txt = payerText(r);
    html += '<div class="payer-sum" style="margin-left:' + ml + ';">' + (txt ? escapeHtml(txt).replace(/合計 \$(\d+)/, '合計 <b>$$$1</b>') : '') + '</div>';
    html += '</div>';
    return html;
  }

  function payerLine(r) {
    const txt = payerText(r);
    if (!txt) return '';
    return '<span class="history-payer">' + escapeHtml(txt) + '</span>';
  }

  function refreshPayerUI(rid) {
    const r = findRecord(rid);
    if (!r) return;
    document.querySelectorAll('.payer-block[data-rid="' + rid + '"]').forEach(el => {
      el.outerHTML = buildPayerBlock(r, el.dataset.ctx);
    });
  }

  // 只更新合計與摘要,不重繪輸入框(避免打字時失去焦點)
  function refreshPayerSum(rid) {
    const r = findRecord(rid);
    if (!r) return;
    let total = 0;
    (r.payers || []).forEach(p => { if (hasAmount(p)) total += Number(p.amount); });
    document.querySelectorAll('.payer-block[data-rid="' + rid + '"] .split-total').forEach(el => {
      el.innerHTML = '合計 <b>$' + total + '</b>';
    });
    const txt = payerText(r);
    document.querySelectorAll('.payer-block[data-rid="' + rid + '"] .payer-sum').forEach(el => {
      el.innerHTML = txt ? escapeHtml(txt).replace(/合計 \$(\d+)/, '合計 <b>$$$1</b>') : '';
    });
  }

  let payerSyncTimer = null;
  function queuePayerSync(rid) {
    clearTimeout(payerSyncTimer);
    payerSyncTimer = setTimeout(() => {
      const r = findRecord(rid);
      if (!r) return;
      saveData();
      syncToSheets('update', r);
      renderHistory();
    }, 700);
  }

  function commitPayer(r) {
    saveData();
    syncToSheets('update', r);
    refreshPayerUI(r.id);
    renderHistory();
  }

  document.addEventListener('click', e => {
    const t = e.target;
    if (!t || !t.closest) return;
    if (t.classList.contains('amt')) return;   // 點金額欄不切換

    // 收起分開付
    const closeBtn = t.closest('.split-close');
    if (closeBtn) {
      splitOpen.delete(closeBtn.dataset.rid);
      refreshPayerUI(closeBtn.dataset.rid);
      return;
    }

    // 展開分開付
    const moreBtn = t.closest('.payer-more');
    if (moreBtn) {
      const r = findRecord(moreBtn.dataset.rid);
      if (!r) return;
      splitOpen.add(moreBtn.dataset.rid);
      if (r.each) { r.each = false; saveData(); }
      refreshPayerUI(moreBtn.dataset.rid);
      return;
    }

    // 分開付:勾選 / 取消某人
    const line = t.closest('.split-line');
    if (line) {
      const r = findRecord(line.dataset.rid);
      if (!r) return;
      const name = line.dataset.name;
      const i = (r.payers || []).findIndex(p => p.name === name);
      if (i >= 0) r.payers.splice(i, 1);
      else r.payers.push({ name: name, amount: '' });
      r.each = false;
      commitPayer(r);
      return;
    }

    // 第一層:單選一位付款人 / 各付各
    const chip = t.closest('.payer-chip');
    if (!chip) return;
    const r = findRecord(chip.dataset.rid);
    if (!r) return;
    if (!Array.isArray(r.payers)) r.payers = [];

    if (chip.dataset.each) {
      r.each = !r.each;
      if (r.each) r.payers = [];
    } else {
      const name = chip.dataset.name;
      const only = !r.each && r.payers.length === 1 && r.payers[0].name === name;
      r.each = false;
      r.payers = only ? [] : [{ name: name, amount: '' }];
    }
    commitPayer(r);
  });

  document.addEventListener('input', e => {
    const inp = e.target;
    if (!inp.classList || !inp.classList.contains('amt')) return;
    const line = inp.closest('.split-line');
    if (!line) return;
    const r = findRecord(line.dataset.rid);
    if (!r) return;
    const name = line.dataset.name;
    let p = (r.payers || []).find(x => x.name === name);
    const raw = inp.value.replace(/[^\d]/g, '');
    if (!p) {                       // 直接打金額 = 自動勾選這個人
      if (raw === '') return;
      p = { name: name, amount: '' };
      r.payers.push(p);
      r.each = false;
      line.classList.add('on');
    }
    p.amount = raw === '' ? '' : Number(raw);
    refreshPayerSum(line.dataset.rid);
    queuePayerSync(line.dataset.rid);
  });

  // 付款人姓名設定(最多 4 位,可用 + 新增)
  function renderPayerSetup() {
    const wrap = document.getElementById('payer-setup');
    let html = state.payerNames.map((n, i) =>
      '<input type="text" data-i="' + i + '" maxlength="8" placeholder="付款人 ' + (i + 1) + '" value="' + escapeHtml(n || '') + '">'
    ).join('');
    if (state.payerNames.length < MAX_PAYERS) {
      html += '<button class="payer-add" id="payer-add">＋ 新增</button>';
    }
    wrap.innerHTML = html;

    // 用 input 而不是 change:change 會在「失去焦點」時才觸發,
    // 導致你打完名字直接去點下面的付款人按鈕時,重繪把按鈕換掉,第一下點擊被吃掉。
    wrap.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => {
        state.payerNames[Number(inp.dataset.i)] = inp.value.trim();
        saveData();
        renderToday();
      });
    });

    const addBtn = document.getElementById('payer-add');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        if (state.payerNames.length >= MAX_PAYERS) return;
        state.payerNames.push('');
        saveData();
        renderPayerSetup();
        const inputs = wrap.querySelectorAll('input');
        const last = inputs[inputs.length - 1];
        if (last) last.focus();
      });
    }
  }

  document.getElementById('payer-setup-toggle').addEventListener('click', () => {
    const w = document.getElementById('payer-setup-wrap');
    const open = w.style.display !== 'none';
    w.style.display = open ? 'none' : 'block';
    document.getElementById('payer-setup-toggle').textContent = open ? '設定' : '收起';
  });

  function renderToday() {
    const today = todayISO();
    document.getElementById('date-main').textContent = formatDateMono(today);
    document.getElementById('date-sub').textContent = dayZh(today) + ' · ' + dayShort(today);

    const todayRecords = state.records
      .filter(r => r.date === today)
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

    const status = document.getElementById('today-status');
    if (todayRecords.length === 0) {
      status.innerHTML = '<div class="today-status-empty">今天還沒記 · 選一間或輸入新的店家</div>';
    } else {
      const isFull = todayRecords.length >= 3;
      const limitLabel = isFull ? '今日已滿 3 家' : '已記 ' + todayRecords.length + ' / 3 家';
      status.innerHTML =
        '<div class="today-multi">' +
        todayRecords.map(r =>
          '<div class="today-multi-item">' +
          '<span class="today-time">' + (r.time || '') + '</span>' +
          '<span class="today-shop">' + escapeHtml(r.shop) + '</span>' +
          '<button class="today-del-btn" onclick="deleteTodayRecord(\'' + r.id + '\')">×</button>' +
          '</div>' +
          buildPayerBlock(r, 'today')
        ).join('') +
        '<div class="today-limit-bar">' +
        '<span class="today-limit-text' + (isFull ? ' full' : '') + '">' + limitLabel + '</span>' +
        '</div>' +
        '</div>';
    }
  }

  window.deleteTodayRecord = function(id) {
    state.records = state.records.filter(r => r.id !== id);
    saveData();
    syncToSheets('delete', { id });
    renderAll();
    showToast('已移除');
  };

  function getShopFrequency() {
    const freq = {};
    const lastUsed = {};
    state.records.forEach(r => {
      freq[r.shop] = (freq[r.shop] || 0) + 1;
      lastUsed[r.shop] = Math.max(lastUsed[r.shop] || 0, new Date(r.date + 'T00:00:00').getTime());
    });
    return Object.entries(freq).map(([shop, count]) => ({
      shop, count, lastUsed: lastUsed[shop],
    })).sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      return b.lastUsed - a.lastUsed;
    });
  }

  function renderShops() {
    const grid = document.getElementById('shop-grid');
    const section = document.getElementById('quick-section');
    const shops = getShopFrequency().slice(0, 8);

    if (shops.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';

    grid.innerHTML = shops.map(s =>
      '<button class="shop-btn" onclick="recordLunch(' + JSON.stringify(s.shop).replace(/"/g, '&quot;') + ')">' +
      (s.count > 1 ? '<span class="count">×' + s.count + '</span>' : '') +
      escapeHtml(s.shop) +
      '</button>'
    ).join('');
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    const countEl = document.getElementById('history-count');
    const footerLink = document.getElementById('footer-link');

    const today = todayISO();
    const sorted = [...state.records].sort((a, b) => b.date.localeCompare(a.date));

    countEl.textContent = sorted.length > 0 ? '共 ' + sorted.length + ' 筆' : '';

    if (sorted.length === 0) {
      list.innerHTML = '<div class="empty"><div class="empty-mark">~</div><div class="empty-text">還沒有紀錄</div></div>';
      footerLink.innerHTML = '';
      return;
    }

    // Group by date, sort newest first, within same date sort by createdAt asc
    const byDate = {};
    const dateOrder = [];
    [...state.records]
      .sort((a, b) => b.date.localeCompare(a.date) || (a.createdAt || 0) - (b.createdAt || 0))
      .forEach(r => {
        if (!byDate[r.date]) { byDate[r.date] = []; dateOrder.push(r.date); }
        byDate[r.date].push(r);
      });

    const recentDates = dateOrder.slice(0, 10);
    list.innerHTML = recentDates.map(date => {
      const recs = byDate[date];
      return recs.map((r, i) =>
        '<div class="history-item">' +
        (i === 0
          ? '<div class="history-date">' + relativeDay(date) + '<span class="day">' + dayShort(date) + '</span></div>'
          : '<div class="history-date"></div>'
        ) +
        '<div class="history-shop ' + (date === today ? 'today-mark' : '') + '">' +
        (r.time ? '<span class="history-time">' + r.time + '</span>' : '') +
        escapeHtml(r.shop) + payerLine(r) + '</div>' +
        '<div class="history-actions">' +
        '<button class="history-edit" onclick="confirmEdit(\'' + r.id + '\')">編輯</button>' +
        '<button class="history-delete" onclick="confirmDelete(\'' + r.id + '\')">刪除</button>' +
        '</div>' +
        '</div>'
      ).join('');
    }).join('');

    if (dateOrder.length > 10) {
      footerLink.innerHTML = '<button onclick="showAllHistory()">查看全部 ' + sorted.length + ' 筆 →</button>';
    } else {
      footerLink.innerHTML = '<span style="color:var(--ink-faint);">· 以上為全部紀錄 ·</span>';
    }
  }

  window.confirmDelete = function(id) {
    const r = state.records.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modal-confirm-title').textContent = '刪除這筆紀錄?';
    document.getElementById('modal-confirm-text').textContent = formatDateFull(r.date) + ' · ' + r.shop;
    document.getElementById('modal-confirm').classList.add('show');
    document.getElementById('modal-confirm-yes').onclick = () => {
      state.records = state.records.filter(x => x.id !== id);
      saveData();
      syncToSheets('delete', { id });
      renderAll();
      closeModal('modal-confirm');
      showToast('已刪除');
    };
  };

  window.confirmEdit = function(id) {
    const r = state.records.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modal-edit-date').textContent = formatDateFull(r.date) + ' · ' + r.shop;
    const input = document.getElementById('modal-edit-input');
    input.value = r.shop;
    const mp = document.getElementById('modal-edit-payers');
    mp.innerHTML = buildPayerBlock(r, 'modal');
    document.getElementById('modal-edit').classList.add('show');
    setTimeout(() => { input.focus(); input.select(); }, 150);
    const confirmBtn = document.getElementById('modal-edit-yes');
    confirmBtn.onclick = () => {
      const newShop = input.value.trim();
      if (!newShop) return;
      r.shop = newShop;
      r.updatedAt = Date.now();
      saveData();
      syncToSheets('update', r);
      renderAll();
      closeModal('modal-edit');
      if (document.getElementById('modal-all').classList.contains('show')) showAllHistory();
      showToast('已更新店名');
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') confirmBtn.click();
      if (e.key === 'Escape') closeModal('modal-edit');
    };
  };

  window.showAllHistory = function() {
    const today = todayISO();
    const byDate = {};
    const dateOrder = [];
    [...state.records]
      .sort((a, b) => b.date.localeCompare(a.date) || (a.createdAt || 0) - (b.createdAt || 0))
      .forEach(r => {
        if (!byDate[r.date]) { byDate[r.date] = []; dateOrder.push(r.date); }
        byDate[r.date].push(r);
      });

    document.getElementById('modal-all-list').innerHTML = dateOrder.map(date => {
      const recs = byDate[date];
      return recs.map((r, i) =>
        '<div class="history-item">' +
        (i === 0
          ? '<div class="history-date">' + formatDateShort(date) + '<span class="day">' + dayShort(date) + '</span></div>'
          : '<div class="history-date"></div>'
        ) +
        '<div class="history-shop ' + (date === today ? 'today-mark' : '') + '">' +
        (r.time ? '<span class="history-time">' + r.time + '</span>' : '') +
        escapeHtml(r.shop) + payerLine(r) + '</div>' +
        '<div class="history-actions">' +
        '<button class="history-edit" onclick="confirmEdit(\'' + r.id + '\')">編輯</button>' +
        '<button class="history-delete" onclick="confirmDelete(\'' + r.id + '\')">刪除</button>' +
        '</div>' +
        '</div>'
      ).join('');
    }).join('');
    document.getElementById('modal-all').classList.add('show');
  };

  // ========== Nearby restaurants (OSM Overpass API) ==========
  const btnNearby = document.getElementById('btn-nearby');
  const nearbyResults = document.getElementById('nearby-results');

  function haversineDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000; // meters
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function formatDistance(m) {
    if (m < 1000) return Math.round(m) + 'm';
    return (m / 1000).toFixed(1) + 'km';
  }

  // 多個 Overpass 節點,主站掛掉/塞車時自動換下一個
  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://overpass.osm.jp/api/interpreter'
  ];

  let lastFix = null;      // 最近一次成功的座標,供「再搜一次/擴大範圍」使用
  let lastRadius = 300;

  function fetchWithTimeout(url, opts, ms) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    return fetch(url, Object.assign({}, opts, { signal: ctl.signal }))
      .finally(() => clearTimeout(timer));
  }

  async function fetchNearbyRestaurants(lat, lon, radius) {
    // 注意:out 的順序必須是 [verbosity] [geometry] [limit];
    // 舊版寫成 out center tags 30 → tags 模式不會輸出座標,距離會全部算不出來
    const query =
      '[out:json][timeout:25];' +
      'nwr["amenity"~"^(restaurant|fast_food|cafe|food_court|bar|pub|ice_cream)$"]' +
      '(around:' + radius + ',' + lat + ',' + lon + ');' +
      'out body center 60;';

    let lastErr = null;
    for (const url of OVERPASS_ENDPOINTS) {
      try {
        const resp = await fetchWithTimeout(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(query),
        }, 15000);

        if (!resp.ok) { lastErr = new Error('伺服器回應 ' + resp.status + ' (' + hostOf(url) + ')'); continue; }

        const data = await resp.json();
        return (data.elements || []).map(el => {
          const t = el.tags || {};
          const name = t['name:zh-Hant'] || t['name:zh'] || t.name || t.brand || t.operator || '';
          const elLat = (el.lat != null) ? el.lat : (el.center && el.center.lat);
          const elLon = (el.lon != null) ? el.lon : (el.center && el.center.lon);
          const dist = (elLat != null && elLon != null) ? haversineDistance(lat, lon, elLat, elLon) : null;
          return { name: name, dist: dist };
        }).filter(x => x.name)
          .sort((a, b) => (a.dist == null ? 1e9 : a.dist) - (b.dist == null ? 1e9 : b.dist));

      } catch (e) {
        lastErr = new Error(e.name === 'AbortError'
          ? '連線逾時 (' + hostOf(url) + ')'
          : '連線失敗 (' + hostOf(url) + ')');
      }
    }
    throw lastErr || new Error('所有地圖伺服器都連不上');
  }

  function hostOf(url) { try { return new URL(url).hostname; } catch (e) { return url; } }

  function geoOnce(opts) {
    return new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, opts);
    });
  }

  // 兩段式定位:先快速低精度(室內比較容易成功),失敗再試高精度
  async function getPosition() {
    if (!navigator.geolocation) throw new Error('這個瀏覽器不支援定位功能|GEO_UNSUPPORTED');
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      throw new Error('定位需要 HTTPS 網址才能使用|INSECURE');
    }
    try {
      return await geoOnce({ enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
    } catch (e1) {
      if (e1 && e1.code === 1) throw geoError(e1);   // 權限被拒就不用再試
      try {
        return await geoOnce({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
      } catch (e2) {
        throw geoError(e2);
      }
    }
  }

  function geoError(err) {
    let msg = '無法取得位置';
    let code = 'GEO_' + (err && err.code ? err.code : '0');
    if (err && err.code === 1) msg = '位置權限被拒絕。iPhone 請開:設定 → 隱私權與安全性 → 定位服務 → Safari網站 → 詢問或允許,並在網頁上的「AA」選單 → 網站設定 → 位置 → 允許';
    if (err && err.code === 2) msg = '取得不到位置(GPS/Wi-Fi 訊號不佳,或開了鎖定模式/VPN)';
    if (err && err.code === 3) msg = '定位逾時。請走到窗邊或確認定位服務已開啟,再按一次';
    return new Error(msg + '|' + code);
  }

  // Check URL params for location passed from Shortcuts
  function getLocationFromURL() {
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));
    if (!isNaN(lat) && !isNaN(lon)) return { lat, lon, fromShortcut: true };
    return null;
  }

  async function searchNearby(forcedLocation, radius) {
    radius = radius || 300;
    btnNearby.classList.add('loading');
    btnNearby.innerHTML = '<span class="pin">◉</span>搜尋中...';
    nearbyResults.innerHTML = '<div class="nearby-meta">◉ 定位中…(第一次可能要幾秒)</div>';

    let stage = '定位';
    try {
      let lat, lon, source;
      if (forcedLocation) {
        lat = forcedLocation.lat;
        lon = forcedLocation.lon;
        source = forcedLocation.fromShortcut ? '來自捷徑' : '指定位置';
      } else {
        const pos = await getPosition();
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        source = '目前位置 ±' + Math.round(pos.coords.accuracy || 0) + 'm';
      }
      lastFix = { lat: lat, lon: lon, source: source };
      lastRadius = radius;

      stage = '查詢地圖';
      nearbyResults.innerHTML = '<div class="nearby-meta">◉ ' + escapeHtml(source) + ' · 查詢地圖資料中…</div>';
      const results = await fetchNearbyRestaurants(lat, lon, radius);

      let html = '<div class="nearby-meta">◉ ' + escapeHtml(source) + ' · 半徑 ' + radius + 'm · 找到 ' + results.length + ' 間</div>';

      if (results.length === 0) {
        html += '<div class="nearby-empty">半徑 ' + radius + 'm 內沒有店家資料(OpenStreetMap 在台灣的資料本來就不齊),可以擴大範圍或手動輸入</div>';
      } else {
        html += '<div class="nearby-grid">';
        results.slice(0, 8).forEach(r => {
          const safeName = JSON.stringify(r.name).replace(/"/g, '&quot;');
          html += '<button class="nearby-btn" onclick="recordLunch(' + safeName + ')">';
          html += '<span>' + escapeHtml(r.name) + '</span>';
          if (r.dist != null) html += '<span class="distance">' + formatDistance(r.dist) + '</span>';
          html += '</button>';
        });
        html += '</div>';
      }

      if (radius < 1200) {
        html += '<button class="nearby-more" onclick="expandNearby()">擴大到 ' + Math.min(radius * 2, 1200) + 'm 再找一次</button>';
      }

      nearbyResults.innerHTML = html;
    } catch (err) {
      const parts = String(err.message || err).split('|');
      const msg = parts[0];
      const code = parts[1] || (stage === '定位' ? 'GEO' : 'NET');
      nearbyResults.innerHTML =
        '<div class="nearby-error">⚠ ' + escapeHtml(msg) +
        '<span class="why">卡在:' + stage + ' · 代號 ' + escapeHtml(code) + '</span>' +
        '<button class="retry" onclick="searchNearby(' + (lastFix ? JSON.stringify(lastFix).replace(/"/g, '&quot;') : 'null') + ')">再試一次</button>' +
        '</div>';
    } finally {
      btnNearby.classList.remove('loading');
      btnNearby.innerHTML = '<span class="pin">◉</span>搜尋我附近的餐廳';
    }
  }
  window.searchNearby = searchNearby;

  window.expandNearby = function() {
    searchNearby(lastFix, Math.min(lastRadius * 2, 1200));
  };

  btnNearby.addEventListener('click', () => searchNearby());

  // ========== Custom input ==========
  const customInput = document.getElementById('custom-input');
  const btnCustom = document.getElementById('btn-custom');

  function updateBtnState() {
    btnCustom.disabled = !customInput.value.trim();
  }

  customInput.addEventListener('input', updateBtnState);
  customInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && customInput.value.trim()) submitCustom();
  });

  function submitCustom() {
    const val = customInput.value.trim();
    if (!val) return;
    recordLunch(val);
    customInput.value = '';
    customInput.blur();
    updateBtnState();
  }

  btnCustom.addEventListener('click', submitCustom);
  updateBtnState();

  document.querySelectorAll('.modal-backdrop').forEach(bd => {
    bd.addEventListener('click', (e) => {
      if (e.target === bd) bd.classList.remove('show');
    });
  });

  function renderAll() {
    renderPayerSetup();
    renderToday();
    renderShops();
    renderHistory();
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) renderAll();
  });

  renderAll();

  // 啟動時自動從 Sheets 同步（背景執行，不打擾使用者）
  setTimeout(() => syncFromSheets(false), 1500);

  // 開啟時的行為
  // 重要:iOS Safari / 主畫面 PWA 對「沒有使用者手勢」就呼叫定位常常直接拒絕或不跳權限視窗,
  // 這是舊版一開啟就自動搜尋卻總是失敗的主因。改成:只有捷徑帶座標進來時才自動搜尋。
  const urlLoc = getLocationFromURL();
  if (urlLoc) {
    setTimeout(() => searchNearby(urlLoc), 300);
    if (window.history.replaceState) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  } else {
    nearbyResults.innerHTML = '<div class="nearby-empty">按上面的按鈕才會定位(iPhone 必須由你按一下才會跳出權限)</div>';
  }
</script>
